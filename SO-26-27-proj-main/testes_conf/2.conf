# Definir um tipo de VM chamado "web-server"
D web-server ./vm_inputs ./executavel 512 20 1

# Fazer uma reserva de 2 instâncias do tipo "web-server" no servidor 0
R res-01 web-server 2 0

# Listar o estado do datacenter
L

# Executar a reserva criada
A res-01

# Aguardar 500 milissegundos
E 500

# Listar novamente para ver o resultado final
L